<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyszukiwarka KRS - API MS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #wyniki { margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .wynik-pole { margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .wynik-pole strong { display: inline-block; width: 150px; }
        .error { color: red; font-weight: bold; }
        .radio-group label { display: inline-flex; align-items: center; font-weight: normal; margin-right: 15px; cursor: pointer; }
        .radio-group input[type="radio"] { width: auto; margin-right: 8px; }
        h1 { font-size: 2em; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Wyszukiwarka Podmiotu w KRS</h1>

    <div class="form-group radio-group">
        <label>
            <input type="radio" name="searchType" value="KRS" checked onchange="zmienTypWyszukiwania('KRS')">
            Szukaj po KRS
        </label>
        <label>
            <input type="radio" name="searchType" value="NIP" onchange="zmienTypWyszukiwania('NIP')">
            Szukaj po NIP
        </label>
    </div>

    <div class="form-group">
        <label id="numerLabel" for="numerValue">Wprowadź Numer KRS:</label>
        <input type="text" id="numerValue" placeholder="Np. 0000123456" maxlength="10">
    </div>

    <div class="form-group">
        <label for="rejestr">Wybierz Rodzaj Rejestru:</label>
        <select id="rejestr">
            <option value="P">P - Przedsiębiorcy</option>
            <option value="S">S - Stowarzyszenia</option>
        </select>
    </div>

    <button id="szukajBtn" onclick="pobierzDaneKRS()">Szukaj</button>

    <div id="wyniki"></div>

    <script>
    const URL_BAZOWY = "https://api-krs.ms.gov.pl/api/krs/OdpisPelny/";
    const BRAK_DANYCH = 'Brak danych';
    const BRAK_DANYCH_DLA_ZAPISU = 'nieznana';
    let actSearchType = 'KRS';

    function zmienTypWyszukiwania(typ) {
        actSearchType = typ;
        document.getElementById('numerLabel').innerText = 'Wprowadź Numer ' + typ + ':';
        document.getElementById('numerValue').placeholder = typ === 'NIP' ? 'Np. 1234567890' : 'Np. 0000123456';
        document.getElementById('numerValue').value = '';
    }

    async function pobierzDaneKRS() {
        const val = document.getElementById('numerValue').value.trim();
        const rejestr = document.getElementById('rejestr').value;
        const wynikiContainer = document.getElementById('wyniki');
        const szukajBtn = document.getElementById('szukajBtn');

        wynikiContainer.innerHTML = ''; 

        if (!val || val.length !== 10 || isNaN(val)) {
            wynikiContainer.innerHTML = '<p class="error">Proszę wprowadzić poprawny 10-cyfrowy numer ' + actSearchType + '.</p>';
            return;
        }

        wynikiContainer.innerHTML = '<p>Ładowanie danych, proszę czekać...</p>';
        szukajBtn.disabled = true;
        szukajBtn.innerText = 'Szukanie...';

        try {
            let targetKrs = val;

            if (actSearchType === 'NIP') {
                const dateStr = new Date().toISOString().split('T')[0];
                const wlUrl = `https://wl-api.mf.gov.pl/api/search/nip/${val}?date=${dateStr}`;
                const wlResponse = await fetch(wlUrl);
                
                if (wlResponse.status !== 200) {
                    wynikiContainer.innerHTML = `<p class="error">Błąd pobierania danych z rejestru VAT dla NIP ${val} (status ${wlResponse.status}).</p>`;
                    szukajBtn.disabled = false;
                    szukajBtn.innerText = 'Szukaj';
                    return;
                }

                const wlData = await wlResponse.json();
                const subject = wlData?.result?.subject;

                if (!subject) {
                    wynikiContainer.innerHTML = `<p class="error">Podmiot o numerze NIP ${val} nie został znaleziony w Białej Liście VAT.</p>`;
                    szukajBtn.disabled = false;
                    szukajBtn.innerText = 'Szukaj';
                    return;
                }

                if (!subject.krs) {
                    wynikiContainer.innerHTML = `<p class="error">Podmiot o numerze NIP ${val} nie posiada wpisanego numeru KRS w Białej Liście VAT.</p>`;
                    szukajBtn.disabled = false;
                    szukajBtn.innerText = 'Szukaj';
                    return;
                }

                targetKrs = subject.krs.padStart(10, '0');
            }

            const pelnyURL = `${URL_BAZOWY}${targetKrs}?rejestr=${rejestr}&format=json`;
            const response = await fetch(pelnyURL);

            if (response.status === 200) {
                const data = await response.json();
                wyswietlWyniki(data, wynikiContainer);
            } else if (response.status === 404) {
                wynikiContainer.innerHTML = `<p class="error">Błąd 404: Podmiot o numerze KRS: ${targetKrs} nie został znaleziony w wybranym rejestrze (${rejestr}).</p>`;
            } else {
                wynikiContainer.innerHTML = `<p class="error">Wystąpił nieznany błąd (${response.status}) podczas pobierania danych z usługi.</p>`;
            }

        } catch (error) {
            console.error("Błąd sieci lub parsowania JSON:", error);
            wynikiContainer.innerHTML = '<p class="error">Wystąpił błąd połączenia sieciowego. Spróbuj ponownie.</p>';
        } finally {
            szukajBtn.disabled = false;
            szukajBtn.innerText = 'Szukaj';
        }
    }

    const getLast = (array) => (array && array.length > 0) ? array[array.length - 1] : null;

    function wyswietlWyniki(data, container) {
        const daneDzialu1 = data?.odpis?.dane?.dzial1;
        const naglowek = data?.odpis?.naglowekP;
        
        if (!daneDzialu1 || !naglowek) {
            container.innerHTML = `<p class="error">Nie znaleziono szczegółowych danych podmiotu w odpowiedzi API.</p>`;
            return;
        }
        
        const podmiot = daneDzialu1.danePodmiotu;
        const siedzibaIAdres = daneDzialu1.siedzibaIAdres;
        const kapital = daneDzialu1.kapital;

        const aktualnaNazwaObj = getLast(podmiot?.nazwa);
        const nazwa = aktualnaNazwaObj?.nazwa || BRAK_DANYCH;
        
        const krsNumer = naglowek.numerKRS || BRAK_DANYCH;
        
        const identyfikatoryObj = getLast(podmiot?.identyfikatory);
        const nip = identyfikatoryObj?.identyfikatory?.nip || BRAK_DANYCH;
        let regon = identyfikatoryObj?.identyfikatory?.regon || BRAK_DANYCH;
        
        if (regon !== BRAK_DANYCH) {
            regon = regon.length > 10 ? regon.substring(0, 10) : regon.padEnd(10, '0');
        }
        
        let pelnyAdres = BRAK_DANYCH;
        let miejscowoscDlaZapisu = BRAK_DANYCH_DLA_ZAPISU;
        let kodPocztowyDlaZapisu = '';
        let ulicaDlaZapisu = '';
        
        const aktualnyAdresObj = getLast(siedzibaIAdres?.adres);

        if (aktualnyAdresObj) {
            const ulica = aktualnyAdresObj.ulica || '';
            const numerDomu = aktualnyAdresObj.nrDomu || '';
            const numerLokalu = aktualnyAdresObj.nrLokalu ? '/' + aktualnyAdresObj.nrLokalu : '';
            const kodPocztowy = aktualnyAdresObj.kodPocztowy || '';
            const miejscowosc = aktualnyAdresObj.miejscowosc || '';

            pelnyAdres = `${ulica} ${numerDomu}${numerLokalu}, ${kodPocztowy} ${miejscowosc}`;
            pelnyAdres = pelnyAdres.replace(/\s{2,}/g, ' ').trim() || BRAK_DANYCH;

            miejscowoscDlaZapisu = miejscowosc;
            kodPocztowyDlaZapisu = kodPocztowy ? `(${kodPocztowy})` : '';
            ulicaDlaZapisu = `${ulica} ${numerDomu}${numerLokalu}`.trim();
        }

        let sadRejestrowy = BRAK_DANYCH;
        const wpisySadu = naglowek?.wpis?.filter(w => w.oznaczenieSaduDokonujacegoWpisu && w.oznaczenieSaduDokonujacegoWpisu !== 'SYSTEM') || [];
        const ostatniWpis = getLast(wpisySadu);
        if (ostatniWpis) {
            sadRejestrowy = ostatniWpis.oznaczenieSaduDokonujacegoWpisu;
        }

        let kapitalZakladowy = BRAK_DANYCH;
        const wysokoscKapitaluObj = getLast(kapital?.wysokoscKapitaluZakladowego);
        if (wysokoscKapitaluObj) {
            const wartosc = wysokoscKapitaluObj.wartosc?.replace(',', '.') || '0';
            const waluta = wysokoscKapitaluObj.waluta || 'PLN';
            
            const sformatowanaWartosc = parseFloat(wartosc).toLocaleString('pl-PL', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            kapitalZakladowy = `${sformatowanaWartosc} ${waluta}`;
        }

        const zapisOSadzie = sadRejestrowy.replace('SĄD REJONOWY DLA M.ST. WARSZAWY W WARSZAWIE', 'Sąd Rejonowy dla m.st. Warszawy w Warszawie')
                                   .replace('SĄD REJONOWY DLA M. ST. WARSZAWY W WARSZAWIE', 'Sąd Rejonowy dla m.st. Warszawy w Warszawie')
                                   .replace('SĄD REJONOWY DLA ', 'Sąd Rejonowy dla ')
                                   .replace('SĄD REJONOWY W ', 'Sąd Rejonowy w ')
                                   .replace('KRAJOWEGO REJESTRU SĄDOWEGO', 'Krajowego Rejestru Sądowego');

        let html = '<h2>Znalezione Dane:</h2>';
        html += `
            <div class="wynik-pole"><strong>Nazwa:</strong> <span>${nazwa}</span></div>
            <div class="wynik-pole"><strong>Numer KRS:</strong> <span>${krsNumer}</span></div>
            <div class="wynik-pole"><strong>NIP:</strong> <span>${nip}</span></div>
            <div class="wynik-pole"><strong>REGON:</strong> <span>${regon}</span></div>
            <div class="wynik-pole"><strong>Adres:</strong> <span>${pelnyAdres}</span></div>
            <div class="wynik-pole"><strong>Sąd Rejestrowy:</strong> <span>${sadRejestrowy}</span></div>
            <div class="wynik-pole"><strong>Kapitał Zakładowy:</strong> <span>${kapitalZakladowy}</span></div>
        `;

        const r_regon = regon.replace(BRAK_DANYCH, BRAK_DANYCH_DLA_ZAPISU);
        const r_nip = nip.replace(BRAK_DANYCH, BRAK_DANYCH_DLA_ZAPISU);
        const r_sad = zapisOSadzie.replace(BRAK_DANYCH, BRAK_DANYCH_DLA_ZAPISU);
        const r_krs = krsNumer.replace(BRAK_DANYCH, BRAK_DANYCH_DLA_ZAPISU);
        const r_kapital = kapitalZakladowy.replace(BRAK_DANYCH, BRAK_DANYCH_DLA_ZAPISU);

        html += `
            <p style="margin-top: 30px; font-size: 0.9em; line-height: 1.5;">
                <strong>${nazwa}</strong> z siedzibą przy ${ulicaDlaZapisu} w ${miejscowoscDlaZapisu} ${kodPocztowyDlaZapisu}, REGON: ${r_regon}, NIP: ${r_nip}, wpisaną do Rejestru Przedsiębiorców prowadzonego przez ${r_sad} pod numerem KRS ${r_krs}, o kapitale zakładowym ${r_kapital}.
            </p>
        `;

        container.innerHTML = html;
    }
    </script>
</body>
</html>
